{% extends "base.html" %}

{% block title %}
جستجوی تفسیر قرآن
{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-emerald-50 to-teal-100 py-12 px-4 sm:px-6 lg:px-8" dir="rtl">
    <div class="max-w-3xl mx-auto">
        <!-- هدر -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-emerald-700 to-teal-600">
          سامانه جامع تفسیر قرآن زهرا
        </span>
            </h1>
            <p class="mt-2 text-lg text-gray-600">
                آیه مورد نظر خود را جستجو کنید
            </p>
        </div>

        <!-- کارت جستجو -->
        <div class="bg-white rounded-2xl shadow-xl">
            <div class="p-6 md:p-8">
                <!-- باکس ورودی (جستجو) -->
                <div class="relative">
                    <input type="text"
                           id="searchInput"
                           placeholder="مثلاً: بقره ۲۵۵، یا جزء ۳۰، یا ابتدای آیه..."
                           class="w-full px-5 py-4 text-right text-gray-700 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition duration-200 text-lg">

                    <!-- آیکون جستجو (اختیاری) -->
                    <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                </div>

                <!-- اسپینر لودینگ (مخفی در ابتدا) -->
                <div id="loadingSpinner" class="absolute left-14 top-1/2 transform -translate-y-1/2 hidden">
                    <svg class="animate-spin h-5 w-5 text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor"
                              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>


                <!-- لیست کشویی نتایج جستجو -->
                <div id="searchResults" class="relative mt-1 hidden">
                    <div class="absolute z-10 w-full bg-white border border-gray-200 rounded-xl shadow-lg max-h-80 overflow-y-auto">
                        <ul id="resultsList" class="py-2 divide-y divide-gray-100">
                            <!-- آیتم‌های نتایج به صورت داینامیک اضافه می‌شوند -->
                        </ul>
                        <div id="noResultsMsg" class="px-4 py-3 text-center text-gray-500 hidden">
                            آیه‌ای یافت نشد
                        </div>
                    </div>
                </div>

                <!-- بخش نمایش تفسیر -->
                <div id="tafsirSection" class="mt-8 pt-6 border-t border-gray-100 hidden">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">📖 تفسیر</h2>
                    <div id="tafsirContent" class="prose max-w-none text-gray-700">
                        <!-- متن تفسیر اینجا نمایش داده می‌شود -->
                    </div>
                </div>
            </div>
        </div>

        <!-- فوتر کوچک -->
        <div class="text-center mt-8 text-sm text-gray-500">
            با تایپ هر حرف، آیات مرتبط نمایش داده می‌شوند.
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- جاوااسکریپت مربوط به جستجوی زنده و نمایش تفاسیر بعداً اضافه می‌شود (T-08 تا T-11) -->
<script>
    // فعلاً placeholder برای تسک‌های آینده
    console.log("T-07: صفحه اصلی با باکس جستجو آماده است.");

     // عناصر DOM
    const searchInput = document.getElementById('searchInput');
    const searchResultsDiv = document.getElementById('searchResults');
    const resultsList = document.getElementById('resultsList');
    const noResultsMsg = document.getElementById('noResultsMsg');
    const loadingSpinner = document.getElementById('loadingSpinner');

    // تابع debounce
    function debounce(func, delay) {
      let timeoutId;
      return function(...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => func.apply(this, args), delay);
      };
    }

    // تابع فراخوانی API جستجو
    async function performSearch(query) {
      if (!query.trim()) {
        // اگر جستجو خالی بود، dropdown را مخفی کن
        searchResultsDiv.classList.add('hidden');
        return;
      }

      // نمایش اسپینر
      loadingSpinner.classList.remove('hidden');

      try {
        const response = await fetch(`/api/search/?q=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error('خطا در دریافت نتایج');
        const data = await response.json();

        // نمایش نتایج در dropdown
        renderResults(data.results);
      } catch (error) {
        console.error('Error:', error);
        // نمایش پیام خطا به کاربر
        resultsList.innerHTML = '';
        noResultsMsg.classList.remove('hidden');
        noResultsMsg.innerText = 'خطا در ارتباط با سرور';
        searchResultsDiv.classList.remove('hidden');
      } finally {
        loadingSpinner.classList.add('hidden');
      }
    }

    // تابع رندر نتایج در لیست
    function renderResults(results) {
      // پاک کردن لیست قبلی
      resultsList.innerHTML = '';

      if (!results || results.length === 0) {
        noResultsMsg.classList.remove('hidden');
        resultsList.classList.add('hidden');
      } else {
        noResultsMsg.classList.add('hidden');
        resultsList.classList.remove('hidden');

        results.forEach(item => {
          const li = document.createElement('li');
          li.className = 'px-4 py-3 hover:bg-emerald-50 cursor-pointer transition duration-150';
          li.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="font-medium text-emerald-800">${item.surah_name} - آیه ${item.ayah_number}</span>
              <span class="text-xs text-gray-500">${item.surah_number}:${item.ayah_number}</span>
            </div>
            <div class="text-sm text-gray-600 mt-1">${item.text_prefix || ''}...</div>
          `;
          // هنگام کلیک روی هر آیتم، آیه انتخاب می‌شود (فعلاً فقط لاگ می‌کنیم – برای T-10)
          li.addEventListener('click', () => {
            console.log('آیه انتخاب شد:', item);
            // در T-10 اینجا مقدار input را پر می‌کنیم و تفسیر را بار می‌کنیم
          });
          resultsList.appendChild(li);
        });
      }
      searchResultsDiv.classList.remove('hidden');
    }

    // تابع واکنش به تایپ با debounce
    const debouncedSearch = debounce((event) => {
      const query = event.target.value;
      performSearch(query);
    }, 300);

    // اضافه کردن event listener
    searchInput.addEventListener('input', debouncedSearch);

    // اگر کاربر روی خارج از dropdown کلیک کرد، dropdown را ببند (اختیاری)
    document.addEventListener('click', function(event) {
      if (!searchResultsDiv.contains(event.target) && event.target !== searchInput) {
        searchResultsDiv.classList.add('hidden');
      }
    });

</script>
{% endblock %}
